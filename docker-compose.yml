services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    image: ${COMPOSE_PROJECT_NAME:-clouds_bots}-app
    build: .
    command: ["/bin/sh", "-c", "alembic upgrade head && exec uvicorn gateway.main:app --host 0.0.0.0 --port 8000"]
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["${GATEWAY_HTTP_PORT:-80}:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped
  botx-emulator:
    profiles: [botx-emulator]
    image: ${COMPOSE_PROJECT_NAME:-clouds_bots}-app
    pull_policy: never
    command: ["uvicorn", "gateway.botx_emulator:app", "--host", "0.0.0.0", "--port", "8085", "--no-access-log"]
    volumes: ["botx_emulator_data:/var/lib/botx-emulator"]
    depends_on: [app]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8085/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes: {pgdata: {}, botx_emulator_data: {}}
