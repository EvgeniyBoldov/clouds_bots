# Install in nginx's http context alongside clouds-bots-upstream.conf.
# Provision TLS files separately; deployment only updates the upstream.
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/clouds-bots/tls/fullchain.pem;
    ssl_certificate_key /etc/clouds-bots/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    location / {
        add_header Cache-Control "no-store" always;
        proxy_pass http://clouds_bots;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }
}
