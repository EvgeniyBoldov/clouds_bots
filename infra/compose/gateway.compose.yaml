services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      runtime:
        aliases: [postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  gateway:
    image: "${REGISTRY}/${IMAGE}:${RELEASE_VERSION}"
    restart: unless-stopped
    env_file:
      - ${GATEWAY_RUNTIME_ENV_FILE:-/etc/clouds-bots/runtime.env}
    environment:
      RELEASE_VERSION: "${RELEASE_VERSION}"
      RELEASE_COMMIT: "${RELEASE_COMMIT}"
    networks: [runtime]
    ports:
      - "127.0.0.1:${SLOT_PORT}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "3"
networks:
  runtime:
    name: clouds-bots-runtime
    external: true
volumes:
  postgres-data:
    name: clouds-bots-postgres-data
