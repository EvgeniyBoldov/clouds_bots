[project]
name = "express-bot-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<0.120", "uvicorn[standard]>=0.34,<1", "pybotx>=0.77.2,<1", "sqlalchemy[asyncio]>=2.0.38,<3", "asyncpg>=0.30,<1", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "prometheus-client>=0.21,<1"]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "aiosqlite>=0.21,<1", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
[tool.ruff]
line-length = 100
